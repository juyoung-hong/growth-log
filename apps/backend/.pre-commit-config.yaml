repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^apps/backend/.*\.py$

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        files: ^apps/backend/.*\.py$

  - repo: local
    hooks:
      - id: pytest
        name: pytest (backend)
        entry: uv run --directory apps/backend pytest
        language: system
        pass_filenames: false
        files: ^apps/backend/