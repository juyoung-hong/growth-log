[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Juyoung Hong", email = "hjy_stat@naver.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "oci>=2.184.1",
    "oracledb>=4.0.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "pytest-cov>=7.1.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.3",
]

[project.scripts]
backend = "main:app"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-dir = "src"
module-name = ["adapters", "application", "config", "domain"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
